[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-platform"
version = "0.0.1"
description = "Fundação local da plataforma de cortes"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "httpx>=0.27,<1", "streamlit>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
speech = ["faster-whisper>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
